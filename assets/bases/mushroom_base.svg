<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Champiñón rojo estilo videojuego</title>
  <desc>Ilustración vectorial simplificada de un champiñón rojo con manchas blancas, pie beige y ojos negros.</desc>

  <defs>
    <!-- Recorte del sombrero para que los lunares laterales puedan meterse bajo el borde exterior -->
    <clipPath id="capClip">
      <path d="M 205 646
               C 160 572, 160 470, 204 386
               C 270 259, 391 214, 512 214
               C 633 214, 754 259, 820 386
               C 864 470, 864 572, 819 646
               C 789 697, 742 729, 675 742
               C 623 752, 568 757, 512 757
               C 456 757, 401 752, 349 742
               C 282 729, 235 697, 205 646 Z"/>
    </clipPath>
  </defs>

  <!-- Relleno del sombrero -->
  <path d="M 205 646
           C 160 572, 160 470, 204 386
           C 270 259, 391 214, 512 214
           C 633 214, 754 259, 820 386
           C 864 470, 864 572, 819 646
           C 789 697, 742 729, 675 742
           C 623 752, 568 757, 512 757
           C 456 757, 401 752, 349 742
           C 282 729, 235 697, 205 646 Z"
        fill="#ef0015"/>

  <!-- Lunares laterales: ligeramente más hacia fuera y recortados por el sombrero -->
  <g clip-path="url(#capClip)">
    <path d="M 187 396
             C 174 434, 169 475, 170 515
             C 172 553, 181 590, 198 618
             C 229 601, 253 560, 260 507
             C 267 458, 257 420, 231 391
             C 215 373, 198 381, 187 396 Z"
          fill="#fff" stroke="#000" stroke-width="16" stroke-linejoin="round"/>

    <path d="M 837 396
             C 850 434, 855 475, 854 515
             C 852 553, 843 590, 826 618
             C 795 601, 771 560, 764 507
             C 757 458, 767 420, 793 391
             C 809 373, 826 381, 837 396 Z"
          fill="#fff" stroke="#000" stroke-width="16" stroke-linejoin="round"/>
  </g>

  <!-- Mancha central -->
  <path d="M 394 328
           C 427 275, 468 250, 512 250
           C 556 250, 597 275, 630 328
           C 648 357, 655 394, 650 428
           C 642 490, 592 528, 512 528
           C 432 528, 382 490, 374 428
           C 369 394, 376 357, 394 328 Z"
        fill="#fff" stroke="#000" stroke-width="18"/>

  <!-- Borde exterior del sombrero, dibujado al final para evitar doble grosor junto a los lunares -->
  <path d="M 205 646
           C 160 572, 160 470, 204 386
           C 270 259, 391 214, 512 214
           C 633 214, 754 259, 820 386
           C 864 470, 864 572, 819 646
           C 789 697, 742 729, 675 742
           C 623 752, 568 757, 512 757
           C 456 757, 401 752, 349 742
           C 282 729, 235 697, 205 646 Z"
        fill="none" stroke="#000" stroke-width="22" stroke-linejoin="round"/>

  <!-- Pie: algo más ancho en la parte inferior -->
  <path d="M 338 610
           C 360 589, 400 575, 449 569
           C 490 564, 534 564, 575 569
           C 624 575, 664 589, 686 610
           C 694 618, 697 628, 697 642
           C 697 714, 682 779, 652 818
           C 627 852, 574 869, 512 869
           C 450 869, 397 852, 372 818
           C 342 779, 327 714, 327 642
           C 327 628, 330 618, 338 610 Z"
        fill="#f6ddb0" stroke="#000" stroke-width="20" stroke-linejoin="round"/>

  <!-- Ojos -->
  <g fill="#000">
    <ellipse cx="455" cy="722" rx="14" ry="40"/>
    <ellipse cx="569" cy="722" rx="14" ry="40"/>
  </g>

  <!-- Brillos de ojos -->
  <g fill="#fff">
    <ellipse cx="455" cy="703" rx="7" ry="13"/>
    <ellipse cx="569" cy="703" rx="7" ry="13"/>
  </g>
</svg>
