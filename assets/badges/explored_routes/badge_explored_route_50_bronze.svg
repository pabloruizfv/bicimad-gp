<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="metalOuter" x1="80" y1="80" x2="432" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E4B487"/>
      <stop offset="35%" stop-color="#C3834D"/>
      <stop offset="70%" stop-color="#A25D31"/>
      <stop offset="100%" stop-color="#67351E"/>
    </linearGradient>

    <linearGradient id="metalInner" x1="140" y1="120" x2="372" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EDC59B"/>
      <stop offset="50%" stop-color="#C18358"/>
      <stop offset="100%" stop-color="#98522E"/>
    </linearGradient>

    <linearGradient id="ribbonRed" x1="140" y1="390" x2="372" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E44848"/>
      <stop offset="100%" stop-color="#A91E1E"/>
    </linearGradient>

    <filter id="shadow" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g id="badge-root" filter="url(#shadow)">
    <circle id="badge-outer-ring" cx="256" cy="220" r="170" fill="url(#metalOuter)"/>
    <circle id="badge-mid-ring" cx="256" cy="220" r="148" fill="#92502C"/>
    <circle id="badge-inner-ring" cx="256" cy="220" r="136" fill="url(#metalInner)"/>
    <circle id="badge-content-border" cx="256" cy="220" r="118"
            fill="none" stroke="#713B20" stroke-opacity="0.35" stroke-width="8"/>

    <g id="badge-ribbon">
      <path d="M170 370H342L320 450L256 422L192 450L170 370Z" fill="url(#ribbonRed)"/>
      <path d="M188 370H324L309 428L256 405L203 428L188 370Z" fill="#7D1414" opacity="0.22"/>
    </g>

    <!-- Zona reservada para el icono de cada emblema -->
<g id="badge-content">
      <!-- Map and docks pictogram adapted from assets/bases/map_docks.svg -->
      <g transform="translate(134.8 92.3) scale(0.24)">
            <!-- Flatter folded-map silhouette: three panels with identical horizontal width -->
            <path fill="#244E78" d="M100 300 L370 215 L640 300 L910 215 L910 810 L640 895 L370 810 L100 895 Z"/>
        
            <!-- Equal white faces; fold gaps reduced to the same visual weight as the outer border -->
            <path fill="#FFFFFF" d="M124 316 L358 242 L358 783 L124 849 Z"/>
            <path fill="#FFFFFF" d="M382 242 L628 320 L628 853 L382 775 Z"/>
            <path fill="#FFFFFF" d="M652 320 L886 246 L886 779 L652 853 Z"/>
        
            <!-- Dashed route kept clear of both docking-station icons -->
            <!-- Fixed filled route segments keep their count at badge scale. -->
            <g fill="#244E78">
              <rect x="306" y="630" width="38" height="24" rx="12" transform="rotate(-20 325 642)"/>
              <rect x="350" y="615" width="62" height="24" rx="12" transform="rotate(-21 381 627)"/>
              <rect x="414" y="599" width="62" height="24" rx="12" transform="rotate(8 445 611)"/>
              <rect x="478" y="616" width="62" height="24" rx="12" transform="rotate(24 509 628)"/>
              <rect x="542" y="645" width="62" height="24" rx="12" transform="rotate(18 573 657)"/>
              <rect x="606" y="646" width="62" height="24" rx="12" transform="rotate(-15 637 658)"/>
              <rect x="665" y="610" width="48" height="24" rx="12" transform="rotate(-28 689 622)"/>
            </g>
        
            <!-- Origin docking station -->
            <g transform="translate(155 590) scale(1.9)">
              <path fill="#244E78" fill-rule="evenodd" clip-rule="evenodd"
                    d="M13 94C10 94 10 92 10 90V80C10 77 10 76 13 76H27C31 75 31 73 31 67V24C31 11 39 4 50 4S69 11 69 24V67C69 73 69 75 73 76H87C90 76 90 77 90 80V90C90 92 90 94 87 94H13ZM44 70V31C44 26 46 23 50 23S56 26 56 31V70H44Z"/>
            </g>
        
            <!-- Destination docking station: identical size -->
            <g transform="translate(700 410) scale(1.9)">
              <path fill="#244E78" fill-rule="evenodd" clip-rule="evenodd"
                    d="M13 94C10 94 10 92 10 90V80C10 77 10 76 13 76H27C31 75 31 73 31 67V24C31 11 39 4 50 4S69 11 69 24V67C69 73 69 75 73 76H87C90 76 90 77 90 80V90C90 92 90 94 87 94H13ZM44 70V31C44 26 46 23 50 23S56 26 56 31V70H44Z"/>
            </g>
      </g>
    </g>
  </g>
</svg>
