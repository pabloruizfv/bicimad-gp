<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="metalOuter" x1="80" y1="80" x2="432" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#73787E"/>
      <stop offset="35%" stop-color="#41464C"/>
      <stop offset="70%" stop-color="#24292E"/>
      <stop offset="100%" stop-color="#090B0E"/>
    </linearGradient>

    <linearGradient id="metalInner" x1="140" y1="120" x2="372" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5D6268"/>
      <stop offset="50%" stop-color="#34393E"/>
      <stop offset="100%" stop-color="#171A1E"/>
    </linearGradient>

    <linearGradient id="ribbonRed" x1="140" y1="390" x2="372" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E44848"/>
