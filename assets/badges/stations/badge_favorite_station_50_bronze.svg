<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="metalOuter" x1="80" y1="80" x2="432" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E4B487"/>
      <stop offset="35%" stop-color="#C3834D"/>
      <stop offset="70%" stop-color="#A25D31"/>
      <stop offset="100%" stop-color="#67351E"/>
    </linearGradient>

    <linearGradient id="metalInner" x1="140" y1="120" x2="372" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EDC59B"/>
      <stop offset="50%" stop-color="#C18358"/>
      <stop offset="100%" stop-color="#98522E"/>
    </linearGradient>

    <linearGradient id="ribbonRed" x1="140" y1="390" x2="372" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E44848"/>
      <stop offset="100%" stop-color="#A91E1E"/>
    </linearGradient>

    <filter id="shadow" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g id="badge-root" filter="url(#shadow)">
