name: Publication safety

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check public files and history (no credentials needed)
        run: python3 tools/security/check_publication.py --history
      - name: Test publication checks
        run: python3 -m unittest discover -s tools/security/tests
      - name: Test sanitized probes without network
        run: python3 -m unittest discover -s tools/bicimad_probe/tests
